# Render Blueprint Specification for Taj Banjara Hotel Management System
# Free Web Service Tier (No paid disks or subscriptions required)
# Note: On Render's free tier, the filesystem is ephemeral and resets on inactivity spin-down or redeployment.

services:
  - type: web
    name: taj-banjara-hotel-management
    runtime: python
    buildCommand: pip install -r web-app/requirements.txt
    startCommand: gunicorn --chdir web-app --workers 1 --threads 4 app:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/hotel_web.db
      - key: DEMO_MODE
        value: "true"
